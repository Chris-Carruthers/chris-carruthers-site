<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Procedural hide grain: fractal noise, desaturated, laid over the woven straps at low opacity. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.23  0 0 0 0 0.13  0 0 0 0 0.07  0 0 0 0.9 0"/>
  </filter>
  <rect width="240" height="240" filter="url(#g)" opacity="0.55"/>
</svg>
