    <rect x="0.6" y="14.5" width="3.6" height="13" rx="1.2"/><rect x="5.2" y="14.5" width="3.6" height="13" rx="1.2"/><rect x="9.8" y="14.5" width="3.6" height="13" rx="1.2"/>
